name: Monthly index build

# The IRS refreshes these datasets monthly. This builds the sharded index and publishes it
# to Cloudflare R2, behind index.check.opengrants.io, which is what `uvx grantcheck`
# downloads from.
#
# R2 rather than a metered host because every user download is egress and R2's egress is
# free. On a metered platform the program working as designed becomes a bill, which is how
# a useful tool gets quietly throttled the moment it starts being used.
#
# A GitHub Release is published from the same build as the documented mirror, so there is
# always a second way to get the data if R2 is unreachable.
on:
  schedule:
    # Second Tuesday, after the IRS monthly posting has settled.
    - cron: "0 9 8-14 * 2"
  workflow_dispatch:
    inputs:
      vintage:
        description: "Vintage label, YYYY-MM. Defaults to the current month."
        required: false

permissions:
  contents: write # to create the mirror release

env:
  R2_ENDPOINT: https://a5a2b776dd851a4e605683ef858e50de.r2.cloudflarestorage.com
  R2_BUCKET: grantcheck-index
  PUBLIC_BASE: https://index.check.opengrants.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --extra ingest

      - name: Determine vintage
        id: vintage
        run: |
          VINTAGE="${{ github.event.inputs.vintage }}"
          if [ -z "$VINTAGE" ]; then VINTAGE=$(date -u +%Y-%m); fi
          echo "vintage=$VINTAGE" >> "$GITHUB_OUTPUT"

      - name: Build the index
        run: uv run python -m grantcheck.ingest.run --out build --vintage "${{ steps.vintage.outputs.vintage }}"

      - name: Verify every shard the manifest references exists
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          d = pathlib.Path("build") / os.environ["VINTAGE"]
          m = json.loads((d / "manifest.json").read_text())
          missing = [s["file"] for s in m["shards"] if not (d / s["file"]).exists()]
          if missing:
              sys.exit(f"manifest references {len(missing)} missing shards")
          print(f"{len(m['shards'])} shards verified against the manifest")
          PY
        env:
          VINTAGE: ${{ steps.vintage.outputs.vintage }}

      # Shards first, manifest last. The manifest is the commit point: until it changes,
      # clients keep resolving the previous vintage consistently, so an upload that fails
      # halfway cannot leave anyone reading a half-published index.
      #
      # Shards are immutable — a given vintage's bytes never change — so they cache
      # forever. Only the manifest needs re-reading.
      - name: Upload shards to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 does not implement the newer default checksum behaviour of the AWS CLI.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          VINTAGE: ${{ steps.vintage.outputs.vintage }}
        run: |
          aws s3 sync "build/$VINTAGE/" "s3://$R2_BUCKET/$VINTAGE/" \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "manifest.json" \
            --content-type "application/zstd" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

      # The root manifest.json is the "latest" pointer clients fetch. Short cache, so a new
      # vintage is picked up promptly without hammering the bucket.
      - name: Publish the manifest — the commit point
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          VINTAGE: ${{ steps.vintage.outputs.vintage }}
        run: |
          for KEY in "$VINTAGE/manifest.json" "manifest.json"; do
            aws s3 cp "build/$VINTAGE/manifest.json" "s3://$R2_BUCKET/$KEY" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "application/json" \
              --cache-control "public, max-age=300" \
              --no-progress
          done

      # Fetch what was actually published, over the public URL, and verify a real shard
      # against its declared checksum. Publishing without reading it back is how a broken
      # index sits there looking fine.
      #
      # The descriptive User-Agent is required, not decorative: Cloudflare returns 403 to
      # the default Python-urllib agent. The client sets the same header for the same
      # reason, so this verifies the path a real user takes rather than a privileged one.
      - name: Verify the published index is readable
        run: |
          UA="grantcheck (+https://github.com/egeria-corporation/grantcheck)"
          curl -fsS -A "$UA" "$PUBLIC_BASE/manifest.json" -o /tmp/published.json
          python - <<'PY'
          import hashlib, json, os, urllib.request
          UA = "grantcheck (+https://github.com/egeria-corporation/grantcheck)"
          base = os.environ["PUBLIC_BASE"]
          m = json.load(open("/tmp/published.json"))
          shard = m["shards"][0]
          url = f"{base}/{m['vintage']}/{shard['file']}"
          req = urllib.request.Request(url, headers={"User-Agent": UA})
          with urllib.request.urlopen(req, timeout=180) as r:
              blob = r.read()
          got = hashlib.sha256(blob).hexdigest()
          if got != shard["sha256"]:
              raise SystemExit(f"checksum mismatch for {shard['file']}")
          print(f"verified {url} ({len(blob):,} bytes, checksum matches)")
          PY

      # ------------------------------------------------------------------------------
      # Keep the hosted site in step with the index it was just handed.
      #
      # Without this the site freezes at whatever vintage it was first loaded with, while
      # the CLI moves on every month. The two would then disagree about the data itself,
      # which is the one thing the parity discipline cannot catch: the parity test proves
      # both implementations read the same row the same way, not that they are looking at
      # the same row.
      #
      # This runs AFTER the manifest is published, because it reads the published index
      # rather than the local build - so what lands in D1 is byte-for-byte what a user
      # downloads, and a failure here leaves R2 correct and the site merely stale, which is
      # the safe way round.
      #
      # `continue-on-error`: a stale site is a much smaller problem than a failed ingest.
      # The index is the product; the site is a view of it. If this step breaks, the run
      # should still be green for the thing that matters, and the site keeps serving the
      # previous month honestly - it reports its own vintage on every page.
      - name: Refresh the hosted site's database
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; the hosted site will keep serving the previous vintage."
            exit 0
          fi

          uv run python site/scripts/build_d1_import.py --out /tmp/d1load

          cd site
          npm install --no-audit --no-fund --silent wrangler@4

          # Drop the secondary indexes first: maintaining two B-trees across 3.3M inserts
          # costs far more than one rebuild at the end.
          npx wrangler d1 execute grantcheck --remote --file=/tmp/d1load/000-pre.sql -y

          for f in /tmp/d1load/part-*.sql; do
            echo "--- $f"
            npx wrangler d1 execute grantcheck --remote --file="$f" -y
          done

          # Rebuilds the indexes and the FTS table, deletes organizations the new index no
          # longer contains, and only then moves dataset_vintage. That last write is the
          # commit point, exactly as the manifest is for R2.
          npx wrangler d1 execute grantcheck --remote --file=/tmp/d1load/999-post.sql -y

      - name: Confirm the site and the index agree
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VINTAGE: ${{ steps.vintage.outputs.vintage }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || exit 0
          cd site
          npx wrangler d1 execute grantcheck --remote --json \
            --command "SELECT COUNT(*) AS n, COUNT(DISTINCT vintage) AS vintages, MAX(vintage) AS v FROM organization" \
            | tee /tmp/d1check.json
          python - <<'PY'
          import json, os, sys
          raw = open("/tmp/d1check.json").read()
          row = json.loads(raw[raw.index("["):])[0]["results"][0]
          print(row)
          if row["vintages"] != 1:
              sys.exit(f"::error::D1 holds {row['vintages']} vintages; the stale-row delete did not run")
          if row["v"] != os.environ["VINTAGE"]:
              sys.exit(f"::error::D1 is at {row['v']}, expected {os.environ['VINTAGE']}")
          print(f"D1 holds {row['n']:,} organizations, all at {row['v']}")
          PY

      - name: Publish the mirror release
        env:
          GH_TOKEN: ${{ github.token }}
          VINTAGE: ${{ steps.vintage.outputs.vintage }}
        run: |
          gh release create "index-$VINTAGE" \
            --title "Index $VINTAGE" \
            --notes "Sharded index built from the IRS bulk datasets. Primary distribution is $PUBLIC_BASE; this release is the mirror. See manifest.json for the dataset vintages it was built from." \
            build/$VINTAGE/* \
            || gh release upload "index-$VINTAGE" build/$VINTAGE/* --clobber
