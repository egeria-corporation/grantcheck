name: Monthly index build

# The IRS refreshes these datasets monthly. This builds the sharded index and publishes it
# to Cloudflare R2, behind index.check.opengrants.io, which is what `uvx grantcheck`
# downloads from.
#
# R2 rather than a metered host because every user download is egress and R2's egress is
# free. On a metered platform the program working as designed becomes a bill, which is how
# a useful tool gets quietly throttled the moment it starts being used.
#
# A GitHub Release is published from the same build as the documented mirror, so there is
# always a second way to get the data if R2 is unreachable.
on:
  schedule:
    # Second Tuesday, after the IRS monthly posting has settled.
    - cron: "0 9 8-14 * 2"
  workflow_dispatch:
    inputs:
      vintage:
        description: "Vintage label, YYYY-MM. Defaults to the current month."
        required: false

permissions:
  contents: write # to create the mirror release

env:
  R2_ENDPOINT: https://a5a2b776dd851a4e605683ef858e50de.r2.cloudflarestorage.com
  R2_BUCKET: grantcheck-index
  PUBLIC_BASE: https://index.check.opengrants.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --extra ingest

      - name: Determine vintage
        id: vintage
        run: |
          VINTAGE="${{ github.event.inputs.vintage }}"
          if [ -z "$VINTAGE" ]; then VINTAGE=$(date -u +%Y-%m); fi
          echo "vintage=$VINTAGE" >> "$GITHUB_OUTPUT"

      - name: Build the index
        run: uv run python -m grantcheck.ingest.run --out build --vintage "${{ steps.vintage.outputs.vintage }}"

      - name: Verify every shard the manifest references exists
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          d = pathlib.Path("build") / os.environ["VINTAGE"]
          m = json.loads((d / "manifest.json").read_text())
          missing = [s["file"] for s in m["shards"] if not (d / s["file"]).exists()]
          if missing:
              sys.exit(f"manifest references {len(missing)} missing shards")
          print(f"{len(m['shards'])} shards verified against the manifest")
          PY
        env:
          VINTAGE: ${{ steps.vintage.outputs.vintage }}

      # Shards first, manifest last. The manifest is the commit point: until it changes,
      # clients keep resolving the previous vintage consistently, so an upload that fails
      # halfway cannot leave anyone reading a half-published index.
      #
      # Shards are immutable — a given vintage's bytes never change — so they cache
      # forever. Only the manifest needs re-reading.
      - name: Upload shards to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 does not implement the newer default checksum behaviour of the AWS CLI.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          VINTAGE: ${{ steps.vintage.outputs.vintage }}
        run: |
          aws s3 sync "build/$VINTAGE/" "s3://$R2_BUCKET/$VINTAGE/" \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "manifest.json" \
            --content-type "application/zstd" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

      # The root manifest.json is the "latest" pointer clients fetch. Short cache, so a new
      # vintage is picked up promptly without hammering the bucket.
      - name: Publish the manifest — the commit point
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          VINTAGE: ${{ steps.vintage.outputs.vintage }}
        run: |
          for KEY in "$VINTAGE/manifest.json" "manifest.json"; do
            aws s3 cp "build/$VINTAGE/manifest.json" "s3://$R2_BUCKET/$KEY" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "application/json" \
              --cache-control "public, max-age=300" \
              --no-progress
          done

      # Fetch what was actually published, over the public URL, and verify a real shard
      # against its declared checksum. Publishing without reading it back is how a broken
      # index sits there looking fine.
      - name: Verify the published index is readable
        run: |
          curl -fsS "$PUBLIC_BASE/manifest.json" -o /tmp/published.json
          python - <<'PY'
          import hashlib, json, os, urllib.request
          base = os.environ["PUBLIC_BASE"]
          m = json.load(open("/tmp/published.json"))
          shard = m["shards"][0]
          url = f"{base}/{m['vintage']}/{shard['file']}"
          with urllib.request.urlopen(url, timeout=180) as r:
              blob = r.read()
          got = hashlib.sha256(blob).hexdigest()
          if got != shard["sha256"]:
              raise SystemExit(f"checksum mismatch for {shard['file']}")
          print(f"verified {url} ({len(blob):,} bytes, checksum matches)")
          PY

      - name: Publish the mirror release
        env:
          GH_TOKEN: ${{ github.token }}
          VINTAGE: ${{ steps.vintage.outputs.vintage }}
        run: |
          gh release create "index-$VINTAGE" \
            --title "Index $VINTAGE" \
            --notes "Sharded index built from the IRS bulk datasets. Primary distribution is $PUBLIC_BASE; this release is the mirror. See manifest.json for the dataset vintages it was built from." \
            build/$VINTAGE/* \
            || gh release upload "index-$VINTAGE" build/$VINTAGE/* --clobber
