[project]
name = "grantcheck"
version = "0.1.0.dev0"
description = "Federal grant readiness check by EIN — free, open, built on IRS and SAM.gov public data"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Egeria Corporation" }]
keywords = ["grants", "nonprofit", "irs", "990", "sam-gov", "philanthropy", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

# Runtime dependencies are deliberately few. Every one is something that can break `uvx`
# cold start, which is the 60-second quickstart. The budget is ten; adding one is a
# stop-and-ask. Nothing here has a compiled extension — the development host is Windows
# on ARM, where wheel availability is thinnest.
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "zstandard>=0.22",
]

[project.optional-dependencies]
# The MCP server. Separate so a user who only wants the CLI does not pay for it on cold start.
mcp = ["mcp>=1.2"]

# Builds the published index. NOT on the runtime path — a user running `uvx grantcheck`
# must never install these. See prompts/01-build-core.md section 6.
ingest = [
    "httpx>=0.27",
    "zstandard>=0.22",
]

[project.scripts]
grantcheck = "grantcheck.cli:main"

[project.urls]
Homepage = "https://github.com/egeria-corporation/grantcheck"
Repository = "https://github.com/egeria-corporation/grantcheck"
Issues = "https://github.com/egeria-corporation/grantcheck/issues"
Changelog = "https://github.com/egeria-corporation/grantcheck/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grantcheck"]

# The JSON Schema is part of the public contract, so it ships with the package rather than
# living only in the repository. The hosted site validates against the same file.
[tool.hatch.build.targets.wheel.force-include]
"src/grantcheck/data/report-schema-1.0.json" = "grantcheck/data/report-schema-1.0.json"
"src/grantcheck/explanations" = "grantcheck/explanations"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Test-only. Validates real output against the committed JSON Schema, so a change to
    # the public contract cannot pass CI unnoticed. Never a runtime dependency: it would
    # cost uvx cold-start time for something users do not need.
    "jsonschema>=4.20",
]

[tool.uv]
# Workspace-only resolution pin. This does NOT appear in the built wheel's metadata and
# does not constrain anyone installing grantcheck. CI on Linux never sees it.
#
# Why: the `mcp` extra pulls pyjwt[crypto] -> cryptography, and this development host is
# Windows on ARM. Checking PyPI directly, cryptography 46.0.3 is the ONLY release that
# ships a win_arm64 wheel — 42.x through 46.0.7 and 50.x all ship win32/win_amd64 only.
# Without the pin, uv falls back to building it through Rust and the sync fails.
#
# This is an exact pin on a single fluke release, so treat it as temporary. When it rots,
# the fallback is not a different pin: it is to stop installing the mcp extra locally
# (`uv sync --extra ingest`) and let CI cover the MCP server on Linux.
constraint-dependencies = ["cryptography==46.0.3"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

# Ruff formats fenced Python inside Markdown. The documentation and the build prompts are
# full of illustrative snippets that are deliberately aligned for reading rather than
# formatted for execution, and reflowing them would destroy the docs. Source only.
extend-exclude = ["docs", "prompts", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# tests/test_ein.py deliberately contains Arabic-Indic, full-width, Myanmar, and
# superscript digits, plus en and em dashes. RUF001-003 exist to catch exactly these
# characters arriving by accident; here they are the fixtures under test, and the module
# docstring says so. Flagging them would mean deleting the test that proves normalize()
# does not fall for str.isdigit().
"tests/test_ein.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
